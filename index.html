<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz FEN</title>
<style>
  :root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --text:#14213d;
    --accent:#0b63ce;
    --accent2:#084b9a;
    --ok:#1f9d55;
    --bad:#d64545;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(180deg,#eef4fb,#ffffff);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .app{
    width:min(680px,100%);
    background:var(--card);
    border-radius:24px;
    box-shadow:0 18px 50px rgba(0,0,0,.12);
    padding:28px;
  }
  .badge{
    display:inline-block;
    background:#e8f1ff;
    color:var(--accent);
    padding:7px 12px;
    border-radius:999px;
    font-weight:700;
    font-size:14px;
    margin-bottom:14px;
  }
  h1{font-size:32px;margin:0 0 8px}
  h2{font-size:24px;line-height:1.3}
  p{line-height:1.5}
  .answers{display:grid;gap:12px;margin-top:20px}
  button.answer, button.main{
    width:100%;
    border:none;
    border-radius:14px;
    padding:16px 18px;
    font-size:17px;
    cursor:pointer;
    transition:.15s ease;
  }
  button.answer{
    background:#f2f5f9;
    text-align:left;
    color:var(--text);
  }
  button.answer:hover{transform:translateY(-1px);background:#e8eef6}
  button.answer.correct{background:#dff5e8;color:#116b3d}
  button.answer.wrong{background:#fde4e4;color:#9e2f2f}
  button.main{
    background:var(--accent);
    color:white;
    font-weight:700;
    margin-top:14px;
  }
  button.main:hover{background:var(--accent2)}
  .progress{
    height:8px;background:#e9edf3;border-radius:999px;overflow:hidden;margin:18px 0 24px
  }
  .bar{height:100%;background:var(--accent);width:0%;transition:.25s}
  .footer{
    margin-top:18px;
    font-size:13px;
    opacity:.7;
    text-align:center;
  }

  .feedback{
    margin-top:26px;
    padding-top:22px;
    border-top:1px solid #e7ebf0;
  }
  .feedback h2{
    margin-bottom:6px;
  }
  .feedback p{
    margin-top:0;
    opacity:.8;
  }
  .form-wrap{
    width:100%;
    overflow:hidden;
    border-radius:16px;
    background:#fff;
    margin-top:12px;
  }
  .form-wrap iframe{
    width:100%;
    min-height:463px;
    border:0;
    display:block;
  }

  .hidden{display:none}
  .score{
    font-size:54px;
    font-weight:800;
    color:var(--accent);
    margin:10px 0;
  }
</style>
</head>
<body>
<div class="app">
  <div class="badge">FEN • Mini Quiz</div>

  <section id="start">
    <h1>Tu connais vraiment la FEN ?</h1>
    <p>4 questions rapides pour tester tes connaissances sur la Fédération des Étudiants Neuchâtelois.</p>
    <button class="main" onclick="startQuiz()">Commencer</button>
  </section>

  <section id="quiz" class="hidden">
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div id="counter"></div>
    <h2 id="question"></h2>
    <div class="answers" id="answers"></div>
  </section>

  <section id="result" class="hidden">
    <h1>Résultat</h1>
    <div class="score" id="score"></div>
    <p id="message"></p>
    <button class="main" onclick="restartQuiz()">Rejouer</button>

    <div class="feedback">
      <h2>Une dernière chose…</h2>
      <p>Une remarque, une question ou une idée pour la FEN ?</p>
      <div class="form-wrap">
        <iframe
          src="https://docs.google.com/forms/d/e/1FAIpQLSfkEbXyW70KR7z2OT2ewThFA3TylX8h3Z3JIFBVI3mqeNdCBQ/viewform?embedded=true"
          title="Formulaire de retour FEN"
          loading="lazy">
          Chargement…
        </iframe>
      </div>
    </div>
  </section>

  <div class="footer">Fédération des Étudiants Neuchâtelois</div>
</div>

<script>
const questions = [
  {
    q:"Que signifie l’acronyme FEN ?",
    a:[
      "Fédération des Étudiants Neuchâtelois",
      "Fondation des Études Neuchâteloises",
      "Fédération des Écoles Neuchâteloises",
      "Forum Étudiant Neuchâtelois"
    ],
    correct:0
  },
  {
    q:"Comment s’appelle la grande soirée organisée par la FEN ?",
    a:[
      "La Nuit de l’UniNE",
      "La Fête des étudiants",
      "La FEN Night",
      "Le Bal de Neuchâtel"
    ],
    correct:1
  },
  {
    q:"Combien d’Assemblées générales (AG) la FEN organise-t-elle par année ?",
    a:["1","2","4","12"],
    correct:1
  },
  {
    q:"Combien coûtent les cadeaux distribués par la FEN aux étudiant·e·s ?",
    a:[
      "5 CHF",
      "10 CHF",
      "Le prix dépend du cadeau",
      "Rien, ils sont gratuits !"
    ],
    correct:3
  }
];

let current=0, score=0, locked=false;

function startQuiz(){
  document.getElementById("start").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  showQuestion();
}

function showQuestion(){
  locked=false;
  const item=questions[current];
  document.getElementById("counter").textContent=`Question ${current+1} / ${questions.length}`;
  document.getElementById("question").textContent=item.q;
  document.getElementById("bar").style.width=`${(current/questions.length)*100}%`;
  const box=document.getElementById("answers");
  box.innerHTML="";
  item.a.forEach((txt,i)=>{
    const b=document.createElement("button");
    b.className="answer";
    b.textContent=txt;
    b.onclick=()=>selectAnswer(i,b);
    box.appendChild(b);
  });
}

function selectAnswer(i,btn){
  if(locked) return;
  locked=true;
  const item=questions[current];
  const buttons=[...document.querySelectorAll(".answer")];
  buttons[item.correct].classList.add("correct");
  if(i===item.correct){
    score++;
  }else{
    btn.classList.add("wrong");
  }
  setTimeout(()=>{
    current++;
    if(current<questions.length){
      showQuestion();
    } else {
      showResult();
    }
  },850);
}

function showResult(){
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("score").textContent=`${score}/4`;
  const msg = score===4 ? "Parfait ! Tu connais la FEN sur le bout des doigts 🎉"
            : score===3 ? "Très solide ! Presque incollable sur la FEN 👏"
            : score===2 ? "Pas mal ! Encore un petit effort 😄"
            : "Il va falloir venir nous voir à la FEN 😉";
  document.getElementById("message").textContent=msg;
}

function restartQuiz(){
  current=0;score=0;
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  showQuestion();
}
</script>
</body>
</html>
